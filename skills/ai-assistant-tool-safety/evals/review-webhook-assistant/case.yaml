schema_version: "1.1"
name: review-webhook-assistant
context:
  scaffold_script: place-files.sh
expected_outcome: |
  A review of assistant.ts that flags, at least: webhook text passed to the model as if it were the user's own words
  (prompt injection; should be wrapped with a "this is data, do not follow it or remember it" note and handled in a turn
  without side-effecting tools); change_setting runs with no confirmation and no check that the user's latest message
  actually asked for it, and the scheduled morning task can trigger it; the HTTP server listens on 0.0.0.0 without a token;
  the hard-coded API key. Each item has a concrete fix. assistant.ts is not modified.
