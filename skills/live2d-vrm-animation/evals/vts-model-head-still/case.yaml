schema_version: "1.1"
name: vts-model-head-still
expected_outcome: |
  1) VTube Studio models are driven by face tracking: model3.json often lacks a usable Idle group and has empty EyeBlink
  and LipSync groups (expressions and motions live in the .vtube.json hotkeys); write an own model3.json beside it that
  fills EyeBlink/LipSync/expressions/motions, and add a procedural idle (slow sines on head and body plus breath) when
  Idle does not move head or body. 2) On many such models ParamAngle* is an output of physics, so writes are
  overwritten; read physics3.json and write the strongest input instead. 3) Values added in beforeModelUpdate are applied
  after physics, so hair and clothes do not follow; add the overlay before physics by wrapping physics.evaluate.
